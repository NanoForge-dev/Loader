name: Tests

on:
  pull_request:
    branches:
      - main
  # Pushes to main fill the caches that pull requests restore.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: nanoforge-dev/actions/.github/workflows/tests.yml@v3
    with:
      style-scripts: '["lint"]'
      unit-script: test:unit
      e2e-script: "" # e.g. test:e2e, with ./.github/actions/prepare-e2e for its setup
