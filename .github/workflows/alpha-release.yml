name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "The published name of a single package to release"
        type: choice
        required: true
        options:
          - "@nanoforge-dev/loader-client"
          - "@nanoforge-dev/loader-server"
          - "@nanoforge-dev/loader-website"
      dry_run:
        description: Perform a dry run?
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  alpha-release:
    name: Alpha release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Release alpha
        uses: ./node_modules/@nanoforge-dev/actions/actions/release-dev
        with:
          package: ${{ inputs.package }}
          tag: alpha
          dry: ${{ inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
