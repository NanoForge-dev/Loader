packages:
  - apps/*

allowBuilds:
  bun: true

catalogs:
  build:
    turbo: ^2.11.10
    typescript: ^6.0.3
  ci:
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.4
    '@favware/cliff-jumper': ^6.1.0
    husky: ^9.1.7
    lint-staged: ^17.5.1
  core:
    '@types/bun': ^1.4.2
    '@types/node': ^26.6.2
    bun: ^1.3.14
    commander: ^15.0.0
  lint:
    '@nanoforge-dev/utils-eslint-config': ^1.0.2
    '@nanoforge-dev/utils-prettier-config': ^1.0.2
    '@trivago/prettier-plugin-sort-imports': ^6.0.2
    eslint: ^10.11.0
    prettier: ^3.9.9

# shortcut: oxfmt (via @nanoforge-dev/utils-eslint-config) pins a vulnerable tinypool; drop once the eslint config moves to a fixed oxfmt.
overrides:
  tinypool: ^2.1.2
